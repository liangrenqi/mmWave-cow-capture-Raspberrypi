# NTP 校时服务器：两套雷达（A 套 6843 / B 套 1843）必须用同一台
# 装到 /etc/systemd/timesyncd.conf.d/99-radar-timesync.conf，步骤与判据见 docs/TIME_SYNC.md
#
# 只用 ntp.aliyun.com 一台、不加备份（2026-10-20 定）：两套用不同服务器会多一项
# 服务器间偏差。代价是阿里云不通时，守护进程的开机校时闸门会一直等，不能采集。
#
# A 套是在主文件 /etc/systemd/timesyncd.conf 里写的 NTP=ntp.aliyun.com（2026-09-01），
# 生效后与本文件相同，不用再装。
#
# 第一行 NTP= 置空：清掉主文件里可能写过的其它服务器。不清的话两处的服务器会合在一起
# 轮询（timesyncd.conf(5)：赋空字符串重置列表，此前的赋值全部作废）。
[Time]
NTP=
NTP=ntp.aliyun.com
