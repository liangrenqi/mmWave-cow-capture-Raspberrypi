# DCA1000 raw-ADC capture tuning. Values validated in stage 5/6 (2026-08).
#
# rmem_max: the TI CLI asks for SO_RCVBUF = 0x7FFFFFFF (~2 GB) at
#   RF_API/rf_api.cpp:701. The kernel silently truncates that to rmem_max
#   with no error, so the default 212992 (208 KB) leaves only ~29 ms of
#   buffering at 7.4 MB/s. 256 MB gives ample headroom.
#
# netdev_max_backlog: protocol-stack ingress queue, sits BEFORE the
#   UDP / AF_PACKET split, so it throttles both CLI_Record and tcpdump.
#   Default 1000 packets is only ~196 ms at 5100 pkt/s.
#
# Previously these were set by prepare.sh via `sysctl -w`, which does not
# persist. A reboot on 2026-08-02 silently reverted them and the capture
# lost 22,510 packets with no error shown. Persisted here so a reboot
# cannot silently downgrade a capture; capture_linux.py also re-checks.
net.core.rmem_max = 268435456
net.core.netdev_max_backlog = 5000
